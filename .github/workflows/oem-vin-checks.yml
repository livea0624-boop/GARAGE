name: OEM VIN checks

on:
  push:
    branches: [feature/oem-vin-chat]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check public/oem-chat.js
          node --check src/worker.js
          node --check src/oem-search.js
      - name: Test OEM endpoint (mocked, no API key)
        run: node --experimental-default-type=module --test tests/oem-search.test.mjs
