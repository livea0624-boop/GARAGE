name: GARAGE mobile UI checks

on:
  push:
    branches: [feature/mobile-usability-refresh]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript
        run: |
          node --check public/garage-mobile-v8.js
          node --check tests/mobile-ui.test.mjs
      - name: Validate responsive layout wiring
        run: node --test tests/mobile-ui.test.mjs
